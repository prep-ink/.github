name: Docs Policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-policy:
    name: docs-policy
    # 自建 runner（org prep-ink / sw-01），不消耗 GitHub 托管分钟。
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
      - name: Checkout organization policy
        uses: actions/checkout@v4
        with:
          repository: prep-ink/.github
          path: .prep-ink-github
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check documentation policy
        run: node .prep-ink-github/.github/scripts/docs-policy-check.mjs
